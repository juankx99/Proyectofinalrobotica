# Practica 4 - Localizacion con AMCL sobre el mapa generado con SLAM
amcl:
  ros__parameters:
    use_sim_time: true

    # Frames y topicos
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: scan
    tf_broadcast: true
    transform_tolerance: 1.0

    # Modelo de movimiento (robot diferencial) y su ruido
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2   # ruido de rotacion por rotacion
    alpha2: 0.2   # ruido de rotacion por traslacion
    alpha3: 0.2   # ruido de traslacion por traslacion
    alpha4: 0.2   # ruido de traslacion por rotacion
    alpha5: 0.2

    # Filtro de particulas
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.2    # actualiza cada 20 cm
    update_min_a: 0.2    # o cada ~11 grados
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    # Modelo del laser (campo de verosimilitud)
    laser_model_type: "likelihood_field"
    laser_min_range: 0.12
    laser_max_range: 12.0
    max_beams: 60
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # Pose inicial (se sobrescribe desde el launch con amcl_x, amcl_y, amcl_yaw)
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    save_pose_rate: 0.5
